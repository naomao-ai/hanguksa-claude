name: Deploy to Cloud Run

# main 에 push 되면 자동으로 Cloud Run 에 배포한다. 수동 실행(workflow_dispatch)도 가능.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: hanguksa-claude
  REGION: asia-northeast3
  SERVICE: hanguksa

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # GitHub Secret(GCP_SA_KEY_B64)에 담긴 base64 서비스 계정 키를 디코드해 인증.
      # base64 한 줄로 보관하므로 여러 줄 JSON 복사 시 손상되는 문제를 피한다.
      - name: Authenticate to Google Cloud
        run: |
          echo "${{ secrets.GCP_SA_KEY_B64 }}" | base64 -d > "$HOME/gcp-key.json"
          gcloud auth activate-service-account --key-file="$HOME/gcp-key.json"
          gcloud config set project "$PROJECT_ID"

      # 로컬 소스에서 빌드+배포 (Cloud Build 사용, 기존 Dockerfile 그대로)
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --set-env-vars "FIREBASE_STORAGE_BUCKET=hanguksa-claude.firebasestorage.app,FIRESTORE_DATABASE_ID=hanguksa-claude" \
            --set-secrets "ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest,ADMIN_SECRET=ADMIN_SECRET:latest,FIREBASE_SERVICE_ACCOUNT=FIREBASE_SERVICE_ACCOUNT:latest"

      - name: Show service URL
        run: |
          echo "배포 완료. Service URL:"
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format="value(status.url)"

      - name: Cleanup key
        if: always()
        run: rm -f "$HOME/gcp-key.json"
