name: Deploy to Cloud Run

# main 에 push 되면 자동으로 Cloud Run 에 배포한다. 수동 실행(workflow_dispatch)도 가능.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: hanguksa-claude
  REGION: asia-northeast3
  SERVICE: hanguksa

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub Secret(GCP_SA_KEY) 의 서비스 계정 키로 GCP 인증
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 로컬 소스에서 빌드+배포 (Cloud Build 사용, 기존 Dockerfile 그대로)
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --allow-unauthenticated \
            --set-env-vars "FIREBASE_STORAGE_BUCKET=hanguksa-claude.firebasestorage.app,FIRESTORE_DATABASE_ID=hanguksa-claude" \
            --set-secrets "ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest,ADMIN_SECRET=ADMIN_SECRET:latest,FIREBASE_SERVICE_ACCOUNT=FIREBASE_SERVICE_ACCOUNT:latest"

      - name: Show service URL
        run: |
          echo "배포 완료. Service URL:"
          gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format="value(status.url)"
